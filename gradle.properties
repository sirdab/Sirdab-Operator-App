#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8192M"
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
# Incremental Kotlin/Native compilation: recompile only changed code, not the whole framework
kotlin.incremental.native=true

# Which stack the app talks to. `demo` runs entirely on the local simulated world and never opens
# a socket; `tms` talks to a real one. Override either without editing this file:
#
#   ./gradlew :androidApp:installDebug -Pdriver.backend=demo
#
# Cloud is the default: it is the deployed stack, and it needs nothing running on this machine.
# The anon key is publishable, not a secret, but it does rotate — ask rather than take it from a
# screenshot.
driver.backend=tms
driver.apiBaseUrl=https://sirdab-tms.fly.dev
driver.supabaseUrl=https://gtsmgahnudlyshvrtdle.supabase.co
driver.supabaseAnonKey=sb_publishable_mj3BjeImvwP1J1zviZRLUw_ggBiZV5J

# Print every API request and response to logcat (`adb logcat -s TmsApi:D`), in release builds too.
# Tokens and the apikey header are blanked on the way out, but bodies still carry the driver's own
# details (national ID, licence, phone).
#
# ON for now, while the app is being tested against the real stack. TODO before release: set this
# back to false (a single build can still turn it on with -Pdriver.httpLog=true).
driver.httpLog=true

# Local, for the seeded test numbers. Needs the transportation stack running, plus
# `scripts/dev-ports.sh` after attaching a device — the app is built against 127.0.0.1, which on a
# phone means the phone. Take the key from `supabase status -o env`.
# driver.apiBaseUrl=http://127.0.0.1:4400
# driver.supabaseUrl=http://127.0.0.1:54321
# driver.supabaseAnonKey=<supabase status -o env>
