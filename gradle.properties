#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8192M"
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
# Incremental Kotlin/Native compilation: recompile only changed code, not the whole framework
kotlin.incremental.native=true

# The TMS stack the app talks to. Override without editing this file, e.g.
#
#   ./gradlew :androidApp:installDebug -Pdriver.apiBaseUrl=http://127.0.0.1:4400
#
# Both the Android app and the iOS framework read these.
# The anon key is publishable, not a secret, but it does rotate — ask rather than take it from a
# screenshot.
driver.apiBaseUrl=https://sirdab-tms.fly.dev
driver.supabaseUrl=https://gtsmgahnudlyshvrtdle.supabase.co
driver.supabaseAnonKey=sb_publishable_mj3BjeImvwP1J1zviZRLUw_ggBiZV5J

# Print every API request and response to logcat (`adb logcat -s TmsApi:D`). Tokens and the apikey
# header are blanked on the way out, but bodies still carry the driver's own details (national ID,
# licence, phone).
#
# `driver.httpLog` is debug builds only. Release builds read `driver.httpLog.release`, which is left
# unset here so a store build never logs; a release build for a tester can turn it on with
# -Pdriver.httpLog.release=true.
driver.httpLog=true

# Local, for the seeded test numbers. Needs the transportation stack running, plus
# `scripts/dev-ports.sh` after attaching a device — the app is built against 127.0.0.1, which on a
# phone means the phone. Take the key from `supabase status -o env`.
# driver.apiBaseUrl=http://127.0.0.1:4400
# driver.supabaseUrl=http://127.0.0.1:54321
# driver.supabaseAnonKey=<supabase status -o env>
