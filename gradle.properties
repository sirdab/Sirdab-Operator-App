#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8192M"
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
# Incremental Kotlin/Native compilation: recompile only changed code, not the whole framework
kotlin.incremental.native=true

# TMS backend. Demo mode is the default: the app runs entirely on the local simulated world and
# never opens a socket. Flip driver.backend to "tms" (and fill the Supabase values from
# `supabase status -o env` in the transportation repo) to talk to a real stack.
driver.backend=tms
driver.apiBaseUrl=https://sirdab-tms.fly.dev
driver.supabaseUrl=https://gtsmgahnudlyshvrtdle.supabase.co
